# Grafana datasources, shared by the docker compose stack (docker-compose.yml) and the host-mode
# stack (docker-compose.observe-host.yml). UIDs are referenced by the dashboards' default datasource
# variables; URLs and credentials come from the container environment (PROMETHEUS_URL,
# GRAFANA_PG_HOST, GRAFANA_PG_USER, GRAFANA_PG_PASSWORD), which each compose file sets.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Switchyard Postgres
    uid: switchyard-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: ${GRAFANA_PG_HOST}
    user: ${GRAFANA_PG_USER}
    editable: false
    jsonData:
      database: llmgateway
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}
