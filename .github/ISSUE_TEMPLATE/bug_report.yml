name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Security issues:** please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: |
        Minimal config (redact secrets) and the request, e.g. a curl command. Configs that use the
        `mock` provider are easiest for us to run.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and response
      description: Response status/body, `x-sy-*` headers and relevant gateway log lines.
      render: text
  - type: input
    id: version
    attributes:
      label: Switchyard version
      placeholder: 'switchyard --version, or the image tag'
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        [
          npx / global CLI,
          library (createGateway),
          Docker / compose,
          Helm / Kubernetes,
          from source,
        ]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'Node 24.x, Redis 8.x, Postgres 18, provider type(s): openai, opencode, …'
