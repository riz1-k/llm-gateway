# OpenSSF Scorecard: supply-chain checks, results under Security → Code scanning and published to
# the OpenSSF API for the README badge (https://scorecard.dev/viewer/?uri=github.com/riz1-k/llm-gateway).
#
# publish_results: true makes the Scorecard API enforce restrictions on this file: no top-level
# env or defaults, no workflow-level write permissions, id-token: write only on the analysis job,
# and that job may only use actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif and ossf/scorecard-action (no run steps, no services).
# See https://github.com/ossf/scorecard-action#workflow-restrictions.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2' # weekly, Tuesday 05:41 UTC (keeps the Maintained check fresh)
  branch_protection_rule: # re-score when branch protection changes

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout (only strictly needed in private repositories)
      actions: read # workflow metadata (only strictly needed in private repositories)
      security-events: write # upload the SARIF results to code scanning
      id-token: write # OIDC token that authenticates publish_results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
