name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: llmgateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dev -d llmgateway_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SWITCHYARD_TEST_REDIS_URL: redis://127.0.0.1:6379/1
      SWITCHYARD_TEST_DATABASE_URL: postgres://dev:dev@127.0.0.1:5432/llmgateway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  package:
    name: Package checks + tarball smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: config.schema.json in sync, TSDoc on public API, publint, attw
        run: pnpm check:package
      - name: Pack, install the tarball in an empty project, run CLI + server + library
        run: |
          (cd packages/gateway && pnpm pack --pack-destination "$RUNNER_TEMP/pkg")
          scripts/pack-smoke.sh "$RUNNER_TEMP"/pkg/switchyard-gateway-*.tgz

  security:
    name: Dependency audit, secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (production deps, high+)
        run: pnpm audit --prod --audit-level=high
      - name: Install pinned gitleaks (checksum-verified)
        run: make tools
      - name: gitleaks (rules + allowlists in .gitleaks.toml)
        run: make lint-secrets

  infra:
    name: Helm, Terraform, alerts, dashboards, workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Install pinned linters (checksum-verified)
        run: make tools
      - name: Dashboards are generated from source
        run: make dashboards-check
      - name: Prometheus rules (promtool check + unit tests)
        run: make lint-alerts
      - name: Helm lint + kubeconform
        run: make lint-helm
      - name: Terraform fmt, validate, tflint
        run: make lint-terraform
      - name: actionlint
        run: make lint-workflows

  image:
    name: Docker build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          push: false
          tags: switchyard:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test and size budget
        run: |
          docker run --rm switchyard:ci --version
          docker run -d --name mock -p 18790:8790 switchyard:ci mock-provider --host 0.0.0.0 --port 8790
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:18790/health
          docker rm -f mock
          size=$(docker image inspect switchyard:ci --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
          [ "$size" -lt 200000000 ] || { echo "::error::image exceeds 200 MB"; exit 1; }
