name: Docker image

# Every run pushes and then signs (cosign keyless), so there is deliberately no pull_request
# trigger: PRs build the image without pushing in ci.yml's `image` job.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
  # release.yml calls this after a successful npm publish (tags pushed with GITHUB_TOKEN do not
  # trigger workflows, so the release passes the version explicitly).
  workflow_call:
    inputs:
      version:
        description: Released version (e.g. 0.1.0) → tags <version>, <major>.<minor> and latest
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called from release.yml → separate group
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/riz1-k/switchyard

jobs:
  publish:
    name: Build and push (linux/amd64, linux/arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
      id-token: write # GitHub OIDC token for keyless cosign signing and the provenance attestation
      attestations: write # store the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=edge,branch=main,enable=${{ inputs.version == '' }}
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Keyless signing: Fulcio issues a short-lived certificate for this job's GitHub OIDC identity
      # and the signature is logged in Rekor. Signing the index digest covers every tag and platform.
      # The certificate identity (SAN) is the workflow file that signs, which is this file in both
      # entry points (direct run, or called by release.yml):
      #   https://github.com/<owner>/<repo>/.github/workflows/docker.yml@<ref>
      # When release.yml calls this file, the certificate's workflow name is the caller's ("Release").
      # Verification commands: docs/DEPLOYMENT.md#verifying-the-image.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature with the documented identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/docker\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
