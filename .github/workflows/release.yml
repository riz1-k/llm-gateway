# Release: Changesets on every push to main.
#
#   pending changesets  → "version" job opens/updates the "Version Packages" PR
#   no changesets and an unpublished version in packages/*/package.json
#                       → pack → publish to npmjs.com (provenance) + git tag + GitHub Release
#                       → scoped copy @riz1-k/switchyard-gateway on GitHub Packages
#                       → container image ghcr.io/riz1-k/switchyard:<version> + latest
#
# The first release publishes the current 0.1.0 as-is (no changeset is pending, the version is not
# on npm yet). One-time setup and the trusted-publishing switch: docs/RELEASING.md.
#
# Opt-in: nothing is versioned or published until the repository variable RELEASE_ENABLED is
# 'true', so fresh clones and forks stop after select-mode with a notice instead of a failed publish.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select mode (version / publish / none)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Report a disabled release
        if: (steps.select-mode.outputs.mode == 'version' || steps.select-mode.outputs.mode == 'publish') && vars.RELEASE_ENABLED != 'true'
        env:
          MODE: ${{ steps.select-mode.outputs.mode }}
        run: echo "::notice title=Release disabled::mode '${MODE}' selected, but the repository variable RELEASE_ENABLED is not 'true', so nothing is versioned or published (docs/RELEASING.md)."

  version:
    name: Open or update the Version Packages PR
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # version commit on the changeset-release/main branch
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # also regenerates config.schema.json, which embeds nothing version-specific today
          script: pnpm run version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  pack:
    name: Build and pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package checks (schema in sync, publint, attw)
        run: |
          pnpm --filter switchyard-gateway run schema:check
          pnpm --filter switchyard-gateway run check:package
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npmjs.com
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Optional: add required reviewers to this environment for a manual approval gate.
    environment: npm
    permissions:
      contents: write # git tag + GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    outputs:
      published: ${{ steps.publish.outputs.published }}
      packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Token fallback (first publish, or registries without trusted publishing). With trusted
      # publishing configured on npmjs.com, delete the NPM_TOKEN secret: OIDC needs no token.
      - name: Configure NPM_TOKEN auth (only when the secret exists)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            # literal on purpose: npm expands ${NPM_TOKEN} from the environment when it reads .npmrc
            # shellcheck disable=SC2016
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> "$HOME/.npmrc"
            echo "auth: NPM_TOKEN"
          else
            echo "auth: trusted publishing (OIDC)"
          fi
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: 'true'
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true

  github-packages:
    name: Publish @riz1-k/switchyard-gateway to GitHub Packages
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@riz1-k'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack under the scoped name and publish
        working-directory: packages/gateway
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Packages only accepts names scoped to the repository owner.
          npm pkg set name=@riz1-k/switchyard-gateway
          pnpm pack --pack-destination "$RUNNER_TEMP"
          # provenance is an npmjs.com feature; GitHub Packages links the repository instead
          npm publish "$RUNNER_TEMP"/riz1-k-switchyard-gateway-*.tgz \
            --registry https://npm.pkg.github.com --provenance=false

  docker:
    name: Container image for the release
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ fromJSON(needs.publish.outputs.packages)[0].version }}
