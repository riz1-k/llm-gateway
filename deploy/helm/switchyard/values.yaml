# Default values for the Switchyard chart. See README.md for the full table.

image:
  # -- Image repository (the same image runs serve, worker and migrate).
  repository: ghcr.io/riz1-k/switchyard
  # -- Image tag; defaults to the chart appVersion.
  tag: ''
  # -- Optional image digest (sha256:…); takes precedence over the tag.
  digest: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# -- Gateway configuration (gateway.yaml) as YAML. Rendered into a ConfigMap and mounted at
# /etc/switchyard/gateway.yaml. `${VAR}` placeholders are resolved by the gateway at runtime
# from the environment (the chart Secret provides SWITCHYARD_ADMIN_TOKEN, DATABASE_URL,
# REDIS_URL and `secrets.extraEnv`). The chart forces server.port/host and metrics.port to
# match the container ports. Reference: config/gateway.example.yaml.
config:
  redis:
    url: '${REDIS_URL}'
    key_prefix: 'sy:'
  database:
    url: '${DATABASE_URL}'
  auth:
    admin_token: '${SWITCHYARD_ADMIN_TOKEN}'
  providers:
    mock:
      type: mock
  models:
    mock-chat: { provider: mock, model: mock-extractive }
    mock-embed: { provider: mock, model: mock-embed, kind: embedding }
  routes:
    mock-chat: { targets: [mock-chat] }
    mock-embed: { targets: [mock-embed] }
  usage:
    # The worker Deployment writes usage to Postgres; never enable this with worker.enabled.
    in_process_writer: false
    # Approximate MAXLEN for the Redis usage stream (~700 B/entry → ~70 MB at the cap).
    stream_maxlen: 100000
  observability:
    log_level: info

# -- Optional pricing table (USD per 1M tokens, format of config/pricing.json). When set it is
# shipped as pricing.json next to gateway.yaml; otherwise the image's default table
# (/app/config/pricing.json) is used unless config.pricing_file says otherwise.
pricing: {}

# -- Use an existing ConfigMap (keys gateway.yaml and optionally pricing.json) instead of `config`.
existingConfigMap: ''

secrets:
  # -- Create a Secret from the values below. Set false and use existingSecret in production.
  create: true
  # -- Existing Secret exposed as environment variables (envFrom). Expected keys:
  # SWITCHYARD_ADMIN_TOKEN, DATABASE_URL, REDIS_URL (+ any provider keys your config uses).
  existingSecret: ''
  # -- Admin API bearer token. Generated (and kept across upgrades) when empty.
  adminToken: ''
  # -- postgres://user:pass@host:5432/llmgateway (required when secrets.create).
  databaseUrl: ''
  # -- redis://host:6379/0 — Redis 8 (vector sets), single primary (required when secrets.create).
  redisUrl: ''
  # -- Additional secret env vars, e.g. {OPENAI_API_KEY: sk-…, OPENCODE_SERVER_PASSWORD: …}.
  extraEnv: {}

# -- Extra (non-secret) environment variables for every Switchyard container.
env: {}

serviceAccount:
  create: true
  name: ''
  annotations: {}
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: [ALL]

api:
  replicaCount: 2
  # -- API port (forced into config.server.port).
  port: 8787
  # -- Prometheus port (forced into config.metrics.port, so /metrics is never on the API port).
  metricsPort: 9464
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 384Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # -- Extra HPA metrics, e.g. a Pods metric on sy_inflight_requests via prometheus-adapter.
    metrics: []
    behavior: {}
  pdb:
    enabled: true
    minAvailable: 1
  # -- Spread replicas over nodes and zones (soft constraints by default).
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  terminationGracePeriodSeconds: 30
  # -- Seconds to keep serving after SIGTERM is due, so endpoints drop the pod first.
  preStopSleepSeconds: 5
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ''
  extraArgs: []

worker:
  # -- Usage stream → Postgres writer. Scales horizontally (consumer group).
  enabled: true
  replicaCount: 1
  metricsPort: 9465
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    metrics: []
    behavior: {}
  pdb:
    enabled: false
    minAvailable: 1
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ''
  extraArgs: []

migrations:
  # -- Run `switchyard migrate` as a pre-install/pre-upgrade hook Job (idempotent, advisory-locked).
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 192Mi }

service:
  type: ClusterIP
  port: 8787
  # -- Fixed nodePort when type is NodePort.
  nodePort: null
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: switchyard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

metrics:
  serviceMonitor:
    # -- Create ServiceMonitors (API + worker). Only rendered when the monitoring.coreos.com/v1 API exists.
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    # -- Ship the Switchyard alert rules (files/alerts.yml) as a PrometheusRule.
    enabled: false
    labels: {}

tests:
  # -- `helm test` pod that checks /readyz.
  enabled: true
