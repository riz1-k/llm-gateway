apiVersion: v1
kind: Service
metadata:
  name: {{ include "switchyard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "switchyard.componentSelector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
# Metrics live on their own ClusterIP Services so they are never exposed by a NodePort,
# LoadBalancer or Ingress of the API Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "switchyard.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    switchyard.dev/metrics: "true"
spec:
  type: ClusterIP
  selector:
    {{- include "switchyard.componentSelector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.api.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "switchyard.fullname" . }}-worker-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    switchyard.dev/metrics: "true"
spec:
  type: ClusterIP
  selector:
    {{- include "switchyard.componentSelector" (dict "ctx" . "component" "worker") | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}
