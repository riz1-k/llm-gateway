{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "switchyard.fullname" . }}-test-readyz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readyz
      image: {{ include "switchyard.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: [node, -e]
      args:
        - |
          const url = 'http://{{ include "switchyard.fullname" . }}:{{ .Values.service.port }}/readyz';
          fetch(url).then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1); },
            (e) => { console.error(e.message); process.exit(1); });
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 96Mi }
{{- end }}
