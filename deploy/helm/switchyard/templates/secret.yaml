{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $name := include "switchyard.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $adminToken := .Values.secrets.adminToken }}
{{- if and (not $adminToken) $existing }}
{{- $adminToken = index $existing.data "SWITCHYARD_ADMIN_TOKEN" | default "" | b64dec }}
{{- end }}
{{- if not $adminToken }}
{{- $adminToken = printf "sk-sy-admin-%s" (randAlphaNum 40) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
type: Opaque
stringData:
  SWITCHYARD_ADMIN_TOKEN: {{ $adminToken | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required (or set secrets.existingSecret)" .Values.secrets.redisUrl | quote }}
  {{- range $k, $v := .Values.secrets.extraEnv }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
